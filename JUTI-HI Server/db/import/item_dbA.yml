  - Id: 5000014
    AegisName: VIP_Ticket_1_Day
    Name: VIP Ticket 1 Day
    Type: Cash
    Flags:
      DropEffect: YELLOW_PILLAR
    Delay:
      Duration: 60000
    Trade:
      Override: 100
      NoDrop: true
    Script: |
      if(#APACHE_PREMIUM_TIME > gettimetick(2)){
        mes "[VIP]";
        mes "^CC0000ขณะนี้ Premium Service ทำงานอยู่ไม่สามารถใช้ได้";
        getitem 5000014,1;
        end;
        }
      rentitem 23165,86400;
      #APACHE_PREMIUM_SERVICE = 9;
      #APACHE_PREMIUM_TIME = gettimetick(2)+86400;
      sc_start SC_APACHE_STORAGE,86400000*1,300;
      sc_start SC_APACHE_EXPBOOST_A,86400000*1,50;
      sc_start SC_APACHE_JEXPBOOST_A,86400000*1,30;
      sc_start SC_APACHE_ITEMBOOST_A,86400000*1,10;
