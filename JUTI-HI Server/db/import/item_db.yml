      if (readparam(bStr) >= 70) {
         bonus bBaseAtk,5;
         if (.@r >= 7)
            bonus bBaseAtk,10;
      }
      if (readparam(bInt) >= 70) {
         bonus bMatk,5;
         if (.@r >= 7)
            bonus bMatk,10;
      }
      if (readparam(bVit) >= 70) {
         bonus bMaxHPrate,2;
         bonus bMaxSPrate,2;
         if (.@r >= 7) {
            bonus bMaxHPrate,2;
            bonus bMaxSPrate,2;
         }
      }
      if (readparam(bAgi) >= 70) {
         bonus bAspdRate,2;
         if (.@r >= 7)
            bonus bAspdRate,3;
      }
      if (readparam(bDex) >= 70) {
         bonus bLongAtkRate,2;
         if (.@r >= 7)
            bonus bLongAtkRate,3;
      }
      if (readparam(bLuk) >= 70) {
         bonus bCritAtkRate,2;
         if (.@r >= 7)
            bonus bCritAtkRate,3;
      }
